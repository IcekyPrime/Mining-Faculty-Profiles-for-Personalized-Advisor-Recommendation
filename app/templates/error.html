<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ status }} · 交我导</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root { color-scheme: light dark; --bg:#f6f3eb; --surface:#fffdf7; --ink:#17251d; --muted:#67756c; --line:#ddd8ca; --accent:#2f6a4c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111712; --surface:#18211a; --ink:#e9eee7; --muted:#9aa79d; --line:#334036; --accent:#8dd0ad; }
    }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:"Segoe UI","Noto Sans SC",sans-serif; }
    main { width:min(560px, calc(100% - 40px)); padding:34px; border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:0 18px 50px rgba(20,30,24,.08); }
    .kicker { font-size:11px; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; }
    h1 { margin:8px 0 12px; font-size:clamp(30px, 6vw, 48px); line-height:1.05; }
    p { margin:10px 0; color:var(--muted); line-height:1.7; }
    code { padding:2px 6px; border-radius:6px; background:color-mix(in srgb, var(--accent) 10%, transparent); color:var(--accent); }
    a { display:inline-block; margin-top:18px; padding:10px 16px; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
    .meta { margin-top:22px; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="kicker">ADVISOR FINDER · ERROR {{ status }}</div>
    <h1>{{ message }}</h1>
    <p>请求没有完成。可以返回首页重试；如果问题持续出现，请把下面的请求编号记下来。</p>
    <p><code>{{ path }}</code></p>
    <a href="/">返回首页</a>
    <div class="meta">
      错误码：{{ code }}{% if request_id %} · 请求编号：{{ request_id }}{% endif %}
    </div>
  </main>
</body>
</html>
