[project]
name = "mentor-finder"
version = "1.9.0"
description = "上海交大五学院导师画像与选导师推荐系统（数据挖掘课程项目）"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# 处理层（关键词、聚类、社区发现、关联规则、评分）
pipeline = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "mlxtend>=0.22",
    "jieba>=0.42",
    "pypinyin>=0.50",
]
# 数据采集层
crawler = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]
# 桌面壳
desktop = [
    "pywebview>=5.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM", "ISC"]
ignore = [
    "E501",   # 长行由格式化工具处理，中文注释不好硬断
    "UP009",  # 保留 # -*- coding: utf-8 -*-
    "SIM905", # 停用词用三引号字符串 + split 更易维护
    "BLE001", # 数据缺表/缺文件时按「无数据」降级是有意为之
]

[tool.ruff.lint.isort]
known-first-party = ["app", "processing"]

[tool.ruff.lint.per-file-ignores]
# processing/score.py 是 v1.0 原始算法，按要求原样保留、不做格式化改写
"processing/score.py" = ["E401", "I001", "F841", "B905"]
# 上游 assistant/answer.py 与论文补充脚本保留 printf 风格，减少与上游 diff
"assistant/answer.py" = ["UP031"]
"scripts/supplement_papers.py" = ["UP031"]
